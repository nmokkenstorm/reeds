# Copy to ~/.config/reeds/config.toml (or point REEDS_CONFIG at it).
# REEDS_DB, REEDS_PORT and REEDS_BIND override the values here.

port = 7333
db = "/absolute/path/reeds.db"

# Loopback by default. Widen this on purpose (containers set
# REEDS_BIND=0.0.0.0 and restrict on the host side instead); loopback stays
# unauthenticated either way, so anything reaching the port from off-box
# needs a token from [[peers]] below.
# bind = "localhost"

# This bridge's identity in the mesh: stamped as `origin` on every whisper it
# publishes, and referenced by peers as their pull cursor key. Defaults to the
# host's hostname; set it explicitly if that is not stable or not unique.
# [bridge]
# name = "laptop"

# Each [[peers]] entry authenticates non-loopback requests bearing its token
# (Authorization: Bearer <token>). Names are self-asserted, not verified.
# [[peers]]
# name = "laptop"
# token_env = "REEDS_PEER_LAPTOP_TOKEN"    # or token = "..." inline

# Each [sources.<name>] section is an independent poller with its own diff
# state, sender name, and credentials. Config is fail-fast: a malformed file or
# a section that fails validation refuses the whole boot. Set enabled = false to
# park a source without deleting its credentials; a disabled source skips
# validation too, so stale tokens do not block startup.

[sources.work]
kind = "bitbucket"
workspace = "acme"
repos = ["web", "api"]
enabled = true
interval_seconds = 30            # optional, default 30, minimum 5
token_env = "BITBUCKET_TOKEN"    # or token = "..." inline
# email = "..."                  # set for Atlassian API tokens (Basic auth)
# topic_prefix = "bb"            # default ("gh" for github)

[sources.personal]
kind = "github"
owner = "someone"
repos = ["some-repo"]
enabled = false
token_env = "GITHUB_TOKEN"
